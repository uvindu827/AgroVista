<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a8e6ff"/>
      <stop offset="100%" stop-color="#e8f7ee"/>
    </linearGradient>
    <linearGradient id="field" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d6f5d6"/>
      <stop offset="100%" stop-color="#9fd08b"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence baseFrequency="0.8" numOctaves="1" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0.1" />
      <feBlend in="SourceGraphic" in2="noise" mode="overlay"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="100%" height="55%" fill="url(#sky)"/>

  <!-- distant hills -->
  <g transform="translate(0,110)">
    <path d="M0,300 C200,120 500,180 800,260 C1100,340 1400,200 1600,260 L1600,900 L0,900 Z" fill="#c5e6c9" opacity="0.9"/>
  </g>

  <!-- field foreground -->
  <rect y="320" width="100%" height="580" fill="url(#field)"/>

  <!-- subtle texture -->
  <rect width="100%" height="100%" fill="transparent" filter="url(#grain)" opacity="0.06"/>

  <!-- stylized leaf with disease spots (foreground focal) -->
  <g transform="translate(1100,420) scale(1.6)">
    <path d="M-180,40 C-140,-60 -20,-120 80,-100 C170,-82 210,-20 200,30 C190,90 120,120 40,130 C-40,140 -150,120 -180,40 Z" fill="#2a7b2a" opacity="0.95" />
    <!-- veins -->
    <path d="M-180,40 C-90,20 10,10 80,-30" stroke="#a7e0a7" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M-20,20 C40,10 90,0 130,10" stroke="#a7e0a7" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- disease spots -->
    <g fill="#8b4b2b" opacity="0.95">
      <circle cx="20" cy="10" r="10" />
      <circle cx="70" cy="40" r="14" />
      <circle cx="-20" cy="60" r="8" />
      <circle cx="40" cy="-20" r="6" />
      <circle cx="100" cy="5" r="7" />
    </g>
  </g>

  <!-- gentle vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.02"/>
</svg>
